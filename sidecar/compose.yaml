services:
  live-tracking:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - live-tracking-data:/data
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - traccar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  live-tracking-data:
networks:
  traccar:
    external: true
    name: ${TRACCAR_NETWORK:-traccar}
