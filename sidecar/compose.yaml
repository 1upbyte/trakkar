services:
  live-tracking:
    image: ghcr.io/1upbyte/trakkar-sidecar:latest
    pull_policy: always
    restart: unless-stopped
    environment:
      PORT: "8080"
      TRAKKAR_DEUG: "${TRAKKAR_DEUG:-0}"
      TRACCAR_MANAGER_URL: "http://traccar:8082"
      DATABASE_PATH: "/data/live-tracking.sqlite"
      FCM_SERVICE_ACCOUNT_FILE: "/run/secrets/firebase-service-account.json"
      APNS_KEY_FILE: "/run/secrets/AuthKey.p8"
      APNS_KEY_ID: "replace-me"
      APNS_TEAM_ID: "replace-me"
      APNS_BUNDLE_ID: "com.oneupbyte.trakkar"
      APNS_SANDBOX: "true"
    volumes:
      - live-tracking-data:/data
      - ./secrets:/run/secrets:ro
    ports:
      - "127.0.0.1:8081:8080"
    networks:
      - traccar
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  live-tracking-data:
networks:
  traccar:
    external: true
    name: traccar
